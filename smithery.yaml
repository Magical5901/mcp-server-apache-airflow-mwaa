# Smithery configuration file: https://smithery.ai/docs/config#smitheryyaml

startCommand:
  type: stdio
  configSchema:
    # JSON Schema defining the configuration options for the MCP.
    # The MWAA target (env_name, aws_profile, region) is supplied per tool call,
    # not at startup, so a single server serves many environments and needs no
    # required startup config.
    type: object
    properties:
      airflowApiVersion:
        type: string
        description: The Airflow API version to use (defaults to v1).
  commandFunction:
    # A function that produces the CLI command to start the MCP on stdio.
    |-
    (config) => ({ command: 'python', args: ['-m', 'src', '--transport', 'stdio'], env: { AIRFLOW_API_VERSION: config.airflowApiVersion || 'v1' } })
